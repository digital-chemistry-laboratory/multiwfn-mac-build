name: build

on: 
  workflow_dispatch:
  push:
    branches: [main, source_dist]
  pull_request:
    branches: [main]

jobs:
  build_no_gui:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Download source and settings
      run: |
        wget http://sobereva.com/multiwfn/misc/Multiwfn_2026.7.15_src_Linux.zip
        unzip Multiwfn_2026.7.15_src_Linux.zip
        mv Multiwfn_2026.7.15_src_Linux/* . 
        rmdir Multiwfn_2026.7.15_src_Linux
        rm Multiwfn_2026.7.15_src_Linux.zip
        wget http://sobereva.com/multiwfn/misc/Multiwfn_2026.7.15_bin_Linux_noGUI.zip
        unzip -o -j Multiwfn_2026.7.15_bin_Linux_noGUI.zip Multiwfn_2026.7.15_bin_Linux_noGUI/{settings.ini,LICENSE.txt,examples/phenol.xyz}
        rm Multiwfn_2026.7.15_bin_Linux_noGUI.zip    

    - name: Install libraries
      run: |
        brew install flint

    - name: Build
      run: |
        cmake -B build -DWITH_OpenMP=ON -DCMAKE_INSTALL_PREFIX=$PWD
        cmake --build build
        cmake --install build
      env:
        FC: gfortran-15
        CC: gcc-15

    - name: Test
      run: build/multiwfn phenol.xyz <<< "q"
  build_gui:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Download source and settings
      run: |
        wget http://sobereva.com/multiwfn/misc/Multiwfn_2026.7.15_src_Linux.zip
        unzip Multiwfn_2026.7.15_src_Linux.zip
        mv Multiwfn_2026.7.15_src_Linux/* . 
        rmdir Multiwfn_2026.7.15_src_Linux
        rm Multiwfn_2026.7.15_src_Linux.zip
        wget http://sobereva.com/multiwfn/misc/Multiwfn_2026.7.15_bin_Linux_noGUI.zip
        unzip -o -j Multiwfn_2026.7.15_bin_Linux_noGUI.zip Multiwfn_2026.7.15_bin_Linux_noGUI/{settings.ini,LICENSE.txt,examples/phenol.xyz}
        rm Multiwfn_2026.7.15_bin_Linux_noGUI.zip    

    - name: Install libraries
      run: |
        brew install flint libx11 libxt mesa openmotif
        wget https://www.dislin.de/downloads/macOS/dislin-11.6.macOS.arm.64.tar.gz
        tar -xvf dislin-11.6.macOS.arm.64.tar.gz
        export DISLIN=$GITHUB_WORKSPACE/dislin
        cd dislin-11.6
        ./INSTALL
        cd ..
        install_name_tool -id $DISLIN/libdislin_d.dylib $DISLIN/libdislin_d.dylib
        install_name_tool -change /usr/X11/lib/libGL.1.dylib /usr/local/lib/libGL.dylib $DISLIN/libdislin_d.dylib

    - name: Build
      run: |
        cmake -B build -DWITH_OpenMP=ON -DWITH_GUI=ON -DDISLIN_DIR=$PWD/dislin -DCMAKE_INSTALL_PREFIX=$PWD
        cmake --build build
        cmake --install build
      env:
        FC: gfortran-15
        CC: gcc-15   

    - name: Test
      run: build/multiwfn phenol.xyz <<< "q"      
      

        
